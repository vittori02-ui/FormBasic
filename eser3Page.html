<html>
    <head>
        <link rel="icon" type="image/x-icon" href="F.png">
        <title>FORM</title>
        <script src="eser3.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
         <style>
            body{
                background-color: rgb(193, 248, 230);
            }
            legend{
                text-align: center;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
            }
            form{
                text-align: center;
                margin-left: 15%;
                width: 1000px;
            }
            ul{
                text-align: left;
                margin-left: 40%;
                margin-top: 2%;
            }
           #box{
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 20px;
            }
           /* #testoSinistra             
            {
                margin-top: 2%;  
                margin-left: 1%;              
            }
            #testoCentro
            {
                margin-top: 2%;
                margin-left: 1%;
            }*/
            #ant,#pdf
            {
                margin-top: 2%;
                padding: 10px 20px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                cursor: pointer;
                transition: 0.2s;
            }
            .riga-testi
            {
                display: flex;
                justify-content: center;
                gap: 40px;
                margin-top: 20px;
            }
            .campo-testo
            {
                display: flex;
                flex-direction: column
            }
            .campo-testo label
            {
                margin-bottom: 5px;
                font-weight: bold;
            }
            textarea
            {
                resize: none;
                height: 60px;
                padding: 5px;
                font-family: Verdana;
            }
            
        </style>
    </head>
    <body>
        <form>
            <fieldset>
                <legend><h2>CREA IL TUO INIVITO</h2></legend>
                <input type="range" id="dim" name="dim" min="20"max=500>
                <label for="dim">Lunghezza</label>
                <br>
                <input type="range" id="dim1" name="dim2" min="20" max="500">
                <label for="dim1">Larghezza</label>
                <br>
                <input type="color" id="col" name="col">
                <label for="col">Colore sfondo</label>
                <ul>
                    <input type="checkbox" id="bordo1" name="stile">
                    <label for="bordo1">Bordo arotondato</label>
                    <br>
                    <input type="checkbox" id="bordo2" name="stile">
                    <label for="bordo2">Ombre</label>                    
                </ul>
                <div class="riga-testi">
                    <div class="campo-testo">
                        <label for="testoDestra" id="dr">Inserisci il testo per il lato destro</label>
                        <input type="textarea" id="testoDestra">
                    </div>
                    <div class="campo-testo">
                        <label for="testoCentro" id="dc">Inserisci il testo al centro</label>
                        <input type="textarea" id="testoCentro">
                    </div>
                    <div class="campo-testo">
                        <label for="testoSinistra" id="ds">Inserisci il testo per il lato sinistro</label>
                        <input type="textarea" id="testoSinistra"> 
                    </div>
                </div>
               <br>
                <button type="button" id="ant" onclick="scelta()">ANTEPRIMA</button>
                <div id="box"></div>
                <br>
                <button type="button" id="pdf" onclick="scaricaPDF()">SCARICA PDF</button>
            </fieldset>
        </form>
    </body>
</html>
